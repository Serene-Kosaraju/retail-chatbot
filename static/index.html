<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brand Assistant — Chat & Order</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="chat">
      <header class="chat__header">
        <div class="chat__brand">
          <span class="chat__dot"></span>
          <h1>Brand Assistant</h1>
        </div>
        <p class="chat__tag">Ask about shipping, returns, sizing — or place an order.</p>
      </header>

      <section id="messages" class="chat__messages" aria-live="polite"></section>

      <form id="composer" class="chat__composer">
        <input
          id="input"
          name="input"
          type="text"
          autocomplete="off"
          placeholder="Type your message…"
          required
        />
        <button type="submit" id="send">Send</button>
      </form>
    </main>

    <script src="/chat.js" defer></script>
  </body>
</html>
